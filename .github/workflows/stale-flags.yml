name: Weekly Stale Flag Audit

# Runs every Monday at 9am UTC
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: Audit Statsig Experiments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find all Statsig experiment references in code
        run: |
          echo "=== Statsig experiments in middleware.js ==="
          grep -oP '(?<=name: ")[^"]+' middleware.js || true

          echo ""
          echo "=== Statsig experiment cookie names ==="
          grep -oP '(?<=cookie: ")[^"]+' middleware.js || true

          echo ""
          echo "=== Statsig gate references in src ==="
          grep -rn "checkGate\|getExperiment\|useExperiment" src/ || true

          echo ""
          echo "=== Kill switch env vars referenced ==="
          grep -oP 'process\.env\.\KKILL_SWITCH_[A-Z_]+' middleware.js || true

      - name: Post audit summary to Slack
        if: env.SLACK_WEBHOOK != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{"text":"📊 Weekly Statsig Flag Audit complete — check Actions for experiment list. Remember to clean up any stale experiments in the Statsig dashboard."}'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
