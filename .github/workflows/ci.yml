name: React CI / CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  # ─── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  # ─── 2. Tests ───────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Run tests + coverage
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7

  # ─── 3. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Build React app
        run: npm run build
        env:
          VITE_MIXPANEL_TOKEN:    ${{ secrets.VITE_MIXPANEL_TOKEN }}
          VITE_STATSIG_CLIENT_KEY: ${{ secrets.VITE_STATSIG_CLIENT_KEY }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ─── 4. Feature Flag Checklist ──────────────────────────────────────────────
  flag-review:
    name: Flag Review Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Statsig experiments registered in middleware.js
        run: |
          echo "=== Experiments tracked in middleware (edge assignments) ==="
          grep -oP '(?<=name: ")[^"]+' middleware.js || true
          echo "✅ Verify these match experiment names in the Statsig dashboard"

      - name: Check experiment cookie names follow convention
        run: |
          echo "=== Experiment cookie names ==="
          grep -oP '(?<=cookie: ")[^"]+' middleware.js || true

      - name: Check kill switch env vars are defined
        run: |
          echo "=== Kill switch env var references in middleware ==="
          grep -oP 'process\.env\.\K[A-Z_]+' middleware.js | sort -u || true

      - name: Check debug badges are removed before production push
        if: github.ref == 'refs/heads/main'
        run: |
          if grep -rn "Live Experiment Variant Active" src/; then
            echo "❌ Debug banner still present. Remove before merging to main."
            exit 1
          fi
          echo "✅ No debug banners found."

  # ─── 5. Stale Flag Audit (main push only) ───────────────────────────────────
  stale-flag-check:
    name: Stale Flag Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Find Statsig experiment names in code
        run: |
          echo "=== Statsig experiments in middleware ==="
          grep -rn "careers_experiment\|profile_experiment\|statsig_exp_" middleware.js src/ || true
          echo "=== Statsig gate references ==="
          grep -rn "react_migration_test\|checkGate\|getExperiment" src/ || true

  # ─── 6. Deploy Preview (PR or feature branch push) ──────────────────────────
  deploy-preview:
    name: Deploy Preview (Vercel)
    needs: [lint, test, build, flag-review]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/statsig-migration')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Deploy preview to Vercel
        run: npx vercel --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─── 7. Deploy Production (main or active feature branch) ───────────────────
  # On main: requires GitHub Environment "production" approval gate.
  # On feature/statsig-migration: deploys directly (no approval needed).
  deploy-production:
    name: Deploy Production (Vercel)
    needs: [lint, test, build, flag-review]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/feature/statsig-migration')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build for production
        run: npm run build
        env:
          VITE_MIXPANEL_TOKEN:     ${{ secrets.VITE_MIXPANEL_TOKEN }}
          VITE_STATSIG_CLIENT_KEY: ${{ secrets.VITE_STATSIG_CLIENT_KEY }}
      - name: Deploy production to Vercel
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{"text":"✅ React deployed to production — commit ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{"text":"❌ React production deploy FAILED — ${{ github.sha }} — ${{ github.actor }}"}'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
