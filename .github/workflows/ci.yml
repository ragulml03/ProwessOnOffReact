name: React CI / CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  # ─── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Run ESLint
        run: npm run lint

  # ─── 2. Tests ───────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps

      - name: Run tests + coverage
        run: npm run test:coverage 2>&1 | tee /tmp/test-out.txt

      - name: Write test summary
        if: always()
        run: |
          # Strip ANSI color/control codes before writing to step summary
          CLEAN=$(sed $'s/\033\[[0-9;]*m//g' /tmp/test-out.txt)
          echo "## 🧪 Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$CLEAN" | grep -E "Test Files|Tests |Duration|passed|failed" | head -8 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$CLEAN" | sed -n '/File.*Stmts/,/^$/p' | head -30 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7

  # ─── 3. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Build React app
        run: npm run build
        env:
          VITE_MIXPANEL_TOKEN:     ${{ secrets.VITE_MIXPANEL_TOKEN }}
          VITE_STATSIG_CLIENT_KEY: ${{ secrets.VITE_STATSIG_CLIENT_KEY }}
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build-${{ github.sha }}
          path: dist/
          retention-days: 7

  # ─── 4. Feature Flag & Middleware Checklist ──────────────────────────────────
  flag-review:
    name: Flag Review Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect flag & middleware info
        run: |
          echo "## 🚩 Feature Flag & Middleware Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Experiments registered in middleware.js" >> $GITHUB_STEP_SUMMARY
          echo "| Name | Cookie |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          paste \
            <(grep -oP '(?<=name: ")[^"]+' middleware.js) \
            <(grep -oP '(?<=cookie: ")[^"]+' middleware.js) \
            | awk -F'\t' '{print "| "$1" | "$2" |"}' >> $GITHUB_STEP_SUMMARY || \
            echo "| (none found) | — |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Kill switch env vars" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -oP 'process\.env\.\KKILL_SWITCH_[A-Z_]+' middleware.js | sort -u >> $GITHUB_STEP_SUMMARY || echo "(none)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Middleware paths handled" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -oP '(?<="/app/)[^"]+' middleware.js | sort -u | sed 's/^/\/app\//' >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Show kill switch status
        env:
          KS_CAREERS: ${{ secrets.KILL_SWITCH_CAREERS }}
          KS_PROFILE:  ${{ secrets.KILL_SWITCH_PROFILE }}
        run: |
          ks_status() {
            case "$1" in
              true)  echo "🔴 ACTIVE — traffic blocked" ;;
              false) echo "🟢 Off" ;;
              *)     echo "⚪ Not set (default: off)" ;;
            esac
          }
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Kill switch status" >> $GITHUB_STEP_SUMMARY
          echo "| Kill Switch | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| KILL_SWITCH_CAREERS | $(ks_status "$KS_CAREERS") |" >> $GITHUB_STEP_SUMMARY
          echo "| KILL_SWITCH_PROFILE | $(ks_status "$KS_PROFILE") |" >> $GITHUB_STEP_SUMMARY

      - name: Check debug badges removed (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          if grep -rn "Live Experiment Variant Active" src/; then
            echo "❌ Debug banner still present — remove before merging to main." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ No debug banners found." >> $GITHUB_STEP_SUMMARY

  # ─── 5. Stale Flag Audit (every push / PR) ─────────────────────────────────
  stale-flag-check:
    name: Stale Flag Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check experiment staleness via New Relic
        env:
          NR_ACCOUNT_ID: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
          NR_API_KEY:    ${{ secrets.NEW_RELIC_API_KEY }}
        run: |
          echo "## 🕐 Stale Flag Audit" >> $GITHUB_STEP_SUMMARY
          echo "_Threshold: no assignments in the last **1 hour** = stale_" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Experiment | Assignments (last 1h) | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|----------------------|--------|" >> $GITHUB_STEP_SUMMARY

          cat > /tmp/nr_check.py << 'PYEOF'
          import json, urllib.request, os, sys
          account_id = os.environ.get("NR_ACCOUNT_ID", "")
          api_key    = os.environ.get("NR_API_KEY", "")
          experiment = sys.argv[1] if len(sys.argv) > 1 else ""
          if not account_id or not api_key:
              print("N/A")
              sys.exit(0)
          nrql = "SELECT count(*) FROM Log WHERE logtype = 'edge_flag_assignment' AND experiment = '" + experiment + "' SINCE 1 hour ago"
          gql  = '{ actor { account(id: ' + account_id + ') { nrql(query: ' + json.dumps(nrql) + ') { results } } } }'
          payload = json.dumps({"query": gql}).encode()
          req = urllib.request.Request("https://api.newrelic.com/graphql", data=payload,
                headers={"Content-Type": "application/json", "API-Key": api_key})
          try:
              resp = urllib.request.urlopen(req, timeout=10)
              data = json.loads(resp.read())
              print(int(data["data"]["actor"]["account"]["nrql"]["results"][0]["count"]))
          except Exception:
              print("0")
          PYEOF

          for EXPERIMENT in careers_experiment profile_experiment; do
            COUNT=$(python3 /tmp/nr_check.py "$EXPERIMENT")
            if [ "$COUNT" = "N/A" ]; then
              STATUS="⚪ NR secret not configured"
            elif [ "$COUNT" -gt 0 ] 2>/dev/null; then
              STATUS="✅ Active"
            else
              STATUS="⚠️ Stale (no traffic in last 1h)"
            fi
            echo "| \`$EXPERIMENT\` | $COUNT | $STATUS |" >> $GITHUB_STEP_SUMMARY
          done

  # ─── 6. Deploy Preview ──────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview (Vercel)
    needs: [lint, test, build, flag-review]
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/feature/statsig-migration')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Deploy preview to Vercel
        id: preview
        run: |
          OUTPUT=$(npx vercel --token ${{ secrets.VERCEL_TOKEN }} --yes 2>&1)
          DEPLOY_URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+' | tail -1)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "## 🚀 Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** [$DEPLOY_URL]($DEPLOY_URL)" >> $GITHUB_STEP_SUMMARY
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─── 7. Deploy Production ───────────────────────────────────────────────────
  deploy-production:
    name: Deploy Production (Vercel)
    needs: [lint, test, build, flag-review]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/feature/statsig-migration')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build for production
        run: npm run build
        env:
          VITE_MIXPANEL_TOKEN:     ${{ secrets.VITE_MIXPANEL_TOKEN }}
          VITE_STATSIG_CLIENT_KEY: ${{ secrets.VITE_STATSIG_CLIENT_KEY }}
      - name: Deploy production to Vercel
        id: production
        run: |
          OUTPUT=$(npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes 2>&1)
          DEPLOY_URL=$(echo "$OUTPUT" | grep -oP 'https://[^\s]+' | tail -1)
          echo "deploy_url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Deployed" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** [$DEPLOY_URL]($DEPLOY_URL)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{"text":"✅ React deployed to production — commit ${{ github.sha }}"}'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-type: application/json' \
            -d '{"text":"❌ React production deploy FAILED — ${{ github.sha }} — ${{ github.actor }}"}'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # ─── 8. CI Summary (always runs last) ───────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, build, flag-review, stale-flag-check, deploy-preview, deploy-production]
    steps:
      - name: Write consolidated CI report
        run: |
          status() {
            case "$1" in
              success)   echo "✅ Passed" ;;
              failure)   echo "❌ Failed" ;;
              skipped)   echo "⊘ Skipped" ;;
              cancelled) echo "⊘ Cancelled" ;;
              *)         echo "— $1" ;;
            esac
          }

          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          # 📋 OffOn React — CI Report

          | | |
          |---|---|
          | **Branch** | \`${{ github.ref_name }}\` |
          | **Commit** | \`${{ github.sha }}\` |
          | **Triggered by** | ${{ github.actor }} |
          | **Event** | ${{ github.event_name }} |

          ## Pipeline Results

          | Step | Result |
          |------|--------|
          | 🔍 Lint | $(status "${{ needs.lint.result }}") |
          | 🧪 Unit Tests (51 tests) | $(status "${{ needs.test.result }}") |
          | 🏗️ Build | $(status "${{ needs.build.result }}") |
          | 🚩 Flag & Middleware Review | $(status "${{ needs['flag-review'].result }}") |
          | 🕐 Stale Flag Audit | $(status "${{ needs['stale-flag-check'].result }}") |
          | 🚀 Deploy Preview | $(status "${{ needs['deploy-preview'].result }}") |
          | 🚀 Deploy Production | $(status "${{ needs['deploy-production'].result }}") |

          ## Coverage & Artifacts

          | Artifact | Link |
          |----------|------|
          | 📊 Coverage Report | [Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | 📦 Build Artifact | [Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ## Links

          | | |
          |---|---|
          | 🌍 Production App | [prowess-on-off-react.vercel.app](https://prowess-on-off-react.vercel.app) |
          | 📈 New Relic Dashboard | [OffOn — Statsig Observability](https://one.newrelic.com/dashboards/detail/ODE1NzI3M3xWSVp8REFTSEJPQVJEfGRhOjEyNzEzNzQ1?account=8157273&state=ac5bfb6c-625b-aa66-a4ef-8d146177bb56) |
          | 🧪 Statsig Console | [console.statsig.com](https://console.statsig.com/PMrROtst5dVAySqc97toz/home) |
          SUMMARY
